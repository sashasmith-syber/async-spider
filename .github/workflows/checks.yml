name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile and validate config
        run: |
          python -m compileall -q crawler_async.py crawler_cli.py metrics_exporter.py example_usage.py
          python -m json.tool config.json > /dev/null
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  package:
    name: compose and image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Validate Compose
        run: |
          docker compose config --quiet
          DB_PASSWORD=example-not-a-real-password \
          GRAFANA_PASSWORD=example-not-a-real-password \
          docker compose -f docker-compose.yml -f docker-compose.optional.yml config --quiet
      - name: Build image
        run: docker build -t async-spider:ci .
      - name: Smoke test without crawling
        run: |
          docker run --rm --read-only --tmpfs /tmp --user 1000:1000 async-spider:ci \
            python -c "import os, crawler_async, crawler_cli, metrics_exporter; assert os.geteuid() == 1000"
          docker run --rm --read-only --tmpfs /tmp --tmpfs /app/data:uid=1000,gid=1000 --user 1000:1000 async-spider:ci \
            python -c "import sqlite3; c=sqlite3.connect('/app/data/smoke.db'); c.execute('create table t(x int)'); c.commit()"

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Scan with Gitleaks 8.30.1
        run: |
          set -euo pipefail
          curl -fsSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --redact --no-banner --exit-code 1
